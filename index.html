<html lang="en" class="dark">
<head>

  <meta property="og:description" content="Organize study sessions, join live study rooms with friends, track weekly progress, and stay motivated through friendly competition." />

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F6F7F9;
      --surface: #FFFFFF;
      --surface-2: #F0F2F5;
      --surface-3: #E6E9EF;
      --text: #111318;
      --text-muted: #5C6473;
      --border: rgba(17, 19, 24, 0.09);
      --border-strong: rgba(17, 19, 24, 0.16);
      --accent: #3B82F6;
      --accent-hover: #2563EB;
      --accent-soft: rgba(59, 130, 246, 0.12);
      --green: #16A34A;
      --green-soft: rgba(22, 163, 74, 0.12);
      --warning: #D97706;
      --amber: #D97706;
      --amber-soft: rgba(217, 119, 6, 0.12);
      --red: #DC2626;
      --red-soft: rgba(220, 38, 38, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    html.dark {
      --bg: #0C0E12;
      --surface: #13161C;
      --surface-2: #191D26;
      --surface-3: #222734;
      --text: #F2F4F8;
      --text-muted: #949CAB;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent-soft: rgba(59, 130, 246, 0.16);
      --green: #22C55E;
      --green-soft: rgba(34, 197, 94, 0.14);
      --warning: #F59E0B;
      --amber: #F59E0B;
      --amber-soft: rgba(245, 158, 11, 0.14);
      --red: #EF4444;
      --red-soft: rgba(239, 68, 68, 0.14);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 {
      font-family: var(--font-display);
      margin: 0;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    p { margin: 0; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: transparent; padding: 0; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Typography Helpers */
    .h1 { font-size: 22px; font-weight: 700; line-height: 1.25; }
    .h2 { font-size: 16px; font-weight: 700; line-height: 1.3; }
    .h3 { font-size: 14px; font-weight: 600; line-height: 1.35; }
    .text-sm { font-size: 13.5px; }
    .text-xs { font-size: 12px; }
    .text-muted { color: var(--text-muted); }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .kpi-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .kpi-value { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.15; letter-spacing: -0.025em; margin-bottom: 4px; font-variant-numeric: tabular-nums; }

    /* Layout Shell */
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: 248px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px 12px;
      gap: 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 4px 6px 12px;
      border-bottom: 1px solid var(--border);
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13.5px;
      letter-spacing: -0.02em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
    }
    .nav-list { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 13.5px;
      color: var(--text-muted);
      transition: background 140ms ease, color 140ms ease;
      text-align: left;
      white-space: nowrap;
    }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 11, 0.55);
      z-index: 50;
    }
    .sidebar-backdrop.open { display: block; }

    .main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: 58px;
      padding: 0 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .mobile-menu-btn { display: none; }
    .page-body {
      padding: 24px;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Flex & Grid Helpers */
    .row { display: flex; align-items: center; gap: 10px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid-sidebar { display: grid; grid-template-columns: 1.65fr 1fr; gap: 16px; align-items: start; }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 20px;
    }
    .card-lg { padding: 24px; border-radius: var(--radius-lg); }
    .card-muted {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }

    /* Buttons & Inputs */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px;
      min-height: 36px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 140ms ease, border-color 140ms ease, opacity 140ms ease, transform 100ms ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface-3); border-color: var(--border-strong); }
    .btn-ghost { color: var(--text-muted); }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
    .btn-danger { background: var(--red-soft); color: var(--red); border: 1px solid rgba(239,68,68,0.28); }
    .btn-danger:hover { opacity: 0.9; }
    .btn-sm { padding: 5px 10px; min-height: 30px; font-size: 12px; }

    .input, .select, .textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 11px;
      font-size: 13.5px;
      color: var(--text);
      transition: border-color 140ms ease, background 140ms ease;
    }
    .input:focus, .select:focus, .textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface);
    }
    .textarea { resize: vertical; min-height: 76px; }
    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    /* Badges, Dots, Chips, Progress */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .badge-accent { background: var(--accent-soft); color: var(--accent); border-color: rgba(59, 130, 246, 0.28); }
    .badge-success { background: var(--green-soft); color: var(--green); border-color: rgba(34, 197, 94, 0.28); }
    .badge-warn { background: var(--amber-soft); color: var(--amber); border-color: rgba(245, 158, 11, 0.28); }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 500;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      white-space: nowrap;
      transition: border-color 140ms ease, background 140ms ease, color 140ms ease;
    }
    .chip:hover { color: var(--text); border-color: var(--border-strong); }
    .chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* Segmented Tabs */
    .tabs {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .tab-btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      transition: background 140ms ease, color 140ms ease;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14);
    }

    .progress-track {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: var(--surface-3);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 240ms ease;
    }

    /* Timer Scenic Stage */
    .timer-stage {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border);
      min-height: 410px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      color: #F2F4F8;
      background: #13161C;
    }
    .timer-stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .timer-scrim {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: background 200ms ease;
    }
    .timer-scrim.soft { background: linear-gradient(180deg, rgba(10,12,18,0.28) 0%, rgba(10,12,18,0.52) 100%); }
    .timer-scrim.balanced { background: linear-gradient(180deg, rgba(10,12,18,0.45) 0%, rgba(10,12,18,0.72) 100%); }
    .timer-scrim.deep { background: linear-gradient(180deg, rgba(10,12,18,0.68) 0%, rgba(10,12,18,0.88) 100%); }
    .timer-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      gap: 20px;
    }
    .timer-clock {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.85rem, 6vw, 4.75rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #FFFFFF;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    /* Calendar Grid */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .cal-header-cell {
      background: var(--surface-2);
      padding: 8px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
    }
    .cal-day-cell {
      background: var(--surface);
      min-height: 92px;
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: background 120ms ease;
    }
    .cal-day-cell:hover { background: var(--surface-2); }
    .cal-day-cell.outside { opacity: 0.42; }
    .cal-day-cell.today .cal-day-num {
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      padding: 1px 6px;
      align-self: flex-start;
    }
    .cal-day-cell.selected { box-shadow: inset 0 0 0 2px var(--accent); }
    .cal-day-num {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .cal-ev-chip {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }

    /* Tables */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td {
      padding: 11px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .data-table th {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-2);
    }
    .data-table td.num, .data-table th.num { text-align: right; }
    .data-table tr:last-child td { border-bottom: 0; }

    /* Modals & Popovers */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 11, 0.72);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }
    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      max-width: 520px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
    }
    .notif-popover {
      position: absolute;
      right: 0;
      top: 44px;
      width: 340px;
      max-width: calc(100vw - 24px);
      max-height: 420px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 12px;
      z-index: 50;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
    }
    .toast-box {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 360px;
    }
    .toast-item {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    }

    /* Auth Gate */
    .auth-page { min-height: 100vh; display: flex; flex-direction: column; }
    .auth-main {
      flex: 1;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 24px;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 40px;
      align-items: center;
    }
    .auth-hero-title {
      font-size: clamp(2rem, 3.6vw, 2.85rem);
      line-height: 1.12;
      font-weight: 700;
      margin-bottom: 12px;
    }

    @media (max-width: 960px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-sidebar, .grid-2, .auth-main { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 55;
        transform: translateX(-100%);
        transition: transform 180ms ease;
      }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu-btn { display: inline-flex; }
      .page-body { padding: 16px; }
      .topbar { padding: 0 14px; }
      .cal-day-cell { min-height: 64px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

      return out;

    /* Date & Streak Utilities */
    function pad2(n) { return n < 10 ? '0' + n : '' + n; }

    function getDateKey(date) {
      var d = date instanceof Date ? date : new Date(date || Date.now());
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }

    function parseDateKey(key) {
      var parts = String(key || '').split('-').map(Number);
      if (parts.length !== 3 || isNaN(parts[0])) return new Date();
      return new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0);
    }

    function addDaysToDateKey(dateKey, delta) {
      var d = parseDateKey(dateKey);
      d.setDate(d.getDate() + delta);
      return getDateKey(d);
    }

    function diffDaysBetweenKeys(fromKey, toKey) {
      var a = parseDateKey(fromKey).getTime();
      var b = parseDateKey(toKey).getTime();
      return Math.round((b - a) / 86400000);
    }

    function getWeekKey(date) {
      var d = new Date(date instanceof Date ? date.getTime() : Date.now());
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
      var week1 = new Date(d.getFullYear(), 0, 4);
      var weekNum = 1 + Math.round(((d.getTime() - week1.getTime()) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
      return d.getFullYear() + '-W' + pad2(weekNum);
    }

    function getPrevWeekKey(date) {
      var d = new Date(date instanceof Date ? date.getTime() : Date.now());
      d.setDate(d.getDate() - 7);
      return getWeekKey(d);
    }

    function getWeekDatesAround(anchorKey) {
      var d = parseDateKey(anchorKey);
      var day = d.getDay();
      var diffToMon = (day + 6) % 7;
      d.setDate(d.getDate() - diffToMon);
      var list = [];
      for (var i = 0; i < 7; i++) {
        var cur = new Date(d.getTime());
        cur.setDate(d.getDate() + i);
        list.push(getDateKey(cur));
      }
      return list;
    }

    function getWeekDateKeys(daysCount) {
      var n = daysCount || 7;
      var out = [];
      var today = getDateKey(new Date());
      for (var i = n - 1; i >= 0; i--) {
        out.push(addDaysToDateKey(today, -i));
      }
      return out;
    }

    function getMonthGridDateKeys(year, monthZero) {
      var first = new Date(year, monthZero, 1, 12, 0, 0);
      var startOffset = (first.getDay() + 6) % 7;
      var gridStart = new Date(year, monthZero, 1 - startOffset, 12, 0, 0);
      var out = [];
      for (var i = 0; i < 42; i++) {
        var cur = new Date(gridStart.getTime());
        cur.setDate(gridStart.getDate() + i);
        out.push(getDateKey(cur));
      }
      return out;
    }

    function formatMinutes(totalMins) {
      var mins = Math.max(0, Math.round(totalMins || 0));
      var h = Math.floor(mins / 60);
      var m = mins % 60;
      if (getLang() === 'ko') {
        if (h > 0 && m > 0) return h + '시간 ' + m + '분';
        if (h > 0) return h + '시간';
        return m + '분';
      }
      if (h > 0 && m > 0) return h + 'h ' + m + 'm';
      if (h > 0) return h + 'h';
      return m + 'm';
    }

    function formatCountdown(seconds) {
      var s = Math.max(0, Math.floor(seconds || 0));
      var hrs = Math.floor(s / 3600);
      var mins = Math.floor((s % 3600) / 60);
      var secs = s % 60;
      if (hrs > 0) return pad2(hrs) + ':' + pad2(mins) + ':' + pad2(secs);
      return pad2(mins) + ':' + pad2(secs);
    }

    function formatReadableDate(dateKey) {
      var d = parseDateKey(dateKey);
      if (getLang() === 'ko') {
        return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
      }
      var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return months[d.getMonth()] + ' ' + d.getDate();
    }

    function formatMessageTimeLocalized(ts) {
      if (!ts) return '';
      var d = new Date(ts);
      return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }

    function computeStreakSummary(sessions) {
      var daySet = {};
      (sessions || []).forEach(function (s) {
        if (s.dateKey && (s.durationMinutes || 0) >= 1) daySet[s.dateKey] = true;
      });
      var today = getDateKey(new Date());
      var yesterday = addDaysToDateKey(today, -1);
      var currentStreak = 0;
      var cursor = daySet[today] ? today : (daySet[yesterday] ? yesterday : null);
      while (cursor && daySet[cursor]) {
        currentStreak++;
        cursor = addDaysToDateKey(cursor, -1);
      }
      var keys = Object.keys(daySet).sort();
      var longestStreak = 0;
      var run = 0;
      for (var i = 0; i < keys.length; i++) {
        if (i === 0 || diffDaysBetweenKeys(keys[i - 1], keys[i]) === 1) {
          run++;
        } else {
          run = 1;
        }
        if (run > longestStreak) longestStreak = run;
      }
      return { currentStreak: currentStreak, longestStreak: longestStreak, activeDays: keys.length };
    }

    /* Smart Planner Algorithms */
    function generateSmartWeeklySchedule(params) {
      var events = params.events || [];
      var examPlans = params.examPlans || [];
      var learningGoals = params.learningGoals || [];
      var dailyCapacityMinutes = Math.max(30, Math.min(360, Number(params.dailyCapacityMinutes) || 120));
      var todayKey = getDateKey(new Date());
      var horizonKeys = [];
      for (var i = 0; i < 7; i++) horizonKeys.push(addDaysToDateKey(todayKey, i));

      var dailyLoad = {};
      horizonKeys.forEach(function (k) { dailyLoad[k] = 0; });
      events.forEach(function (ev) {
        if (dailyLoad[ev.dateKey] !== undefined && !ev.completed) {
          dailyLoad[ev.dateKey] += 45;
        }
      });

      var tasks = [];
      examPlans.forEach(function (ex) {
        if (ex.examDateKey >= todayKey) {
          var rem = Math.max(0, (ex.targetMinutes || 0) - (ex.completedMinutes || 0));
          if (rem > 0) {
            tasks.push({
              title: ex.title,
              subject: ex.subject,
              deadlineKey: ex.examDateKey,
              remaining: rem,
              reason: getLang() === 'ko' ? '다가오는 시험 대비' : 'Upcoming exam prep',
              priorityScore: 100 - Math.max(0, diffDaysBetweenKeys(todayKey, ex.examDateKey))
            });
          }
        }
      });

      learningGoals.forEach(function (g) {
        if (!g.completed && g.endDateKey >= todayKey) {
          var rem = Math.max(0, (g.targetMinutes || 0) - (g.progressMinutes || 0));
          if (rem > 0) {
            tasks.push({
              title: g.title,
              subject: g.subject || 'Other',
              deadlineKey: g.endDateKey,
              remaining: rem,
              reason: getLang() === 'ko' ? '학습 목표 달성' : 'Active learning goal',
              priorityScore: 70 - Math.max(0, diffDaysBetweenKeys(todayKey, g.endDateKey))
            });
          }
        }
      });

      events.forEach(function (ev) {
        if (!ev.completed && ev.type !== 'study_session' && ev.dateKey >= todayKey && ev.dateKey <= horizonKeys[6]) {
          tasks.push({
            title: ev.title,
            subject: ev.subject || 'Other',
            deadlineKey: ev.dateKey,
            remaining: ev.priority === 'high' ? 60 : 45,
            reason: getLang() === 'ko' ? '마감 일정 준비' : 'Deadline preparation',
            priorityScore: (ev.priority === 'high' ? 90 : 60) - Math.max(0, diffDaysBetweenKeys(todayKey, ev.dateKey))
          });
        }
      });

      tasks.sort(function (a, b) { return b.priorityScore - a.priorityScore; });
      var suggestions = [];

      tasks.forEach(function (task) {
        var needed = Math.min(task.remaining, 180);
        while (needed >= 25 && suggestions.length < 10) {
          var bestDay = null;
          var minLoad = Infinity;
          for (var i = 0; i < horizonKeys.length; i++) {
            var dk = horizonKeys[i];
            if (dk > task.deadlineKey) continue;
            if (dailyLoad[dk] + 30 <= dailyCapacityMinutes && dailyLoad[dk] < minLoad) {
              minLoad = dailyLoad[dk];
              bestDay = dk;
            }
          }
          if (!bestDay) break;
          var block = Math.min(60, Math.max(30, needed));
          dailyLoad[bestDay] += block;
          needed -= block;
          suggestions.push({
            id: makeId('sug'),
            dateKey: bestDay,
            subject: task.subject,
            title: (getLang() === 'ko' ? '집중 학습: ' : 'Study Block: ') + task.title,
            durationMinutes: block,
            reason: task.reason
          });
        }
      });

      return suggestions;
    }

    function distributeExamSessions(exam) {
      var todayKey = getDateKey(new Date());
      var daysAvail = Math.max(1, Math.min(21, diffDaysBetweenKeys(todayKey, exam.examDateKey)));
      var rem = Math.max(30, (exam.targetMinutes || 120) - (exam.completedMinutes || 0));
      var sessionLen = rem <= 120 ? 45 : 60;
      var count = Math.max(1, Math.min(daysAvail, Math.ceil(rem / sessionLen)));
      var topics = (exam.topics || []).filter(function (tp) { return !tp.completed; });
      var created = [];
      for (var i = 0; i < count; i++) {
        var dayOffset = Math.floor((i * daysAvail) / count);
        var dk = addDaysToDateKey(todayKey, dayOffset);
        var topicName = topics.length ? topics[i % topics.length].title : exam.title;
        created.push({
          id: makeId('ev'),
          title: (getLang() === 'ko' ? '[시험대비] ' : '[Exam Prep] ') + exam.title + ' — ' + topicName,
          subject: exam.subject,
          type: 'study_session',
          dateKey: dk,
          startTime: '17:00',
          endTime: '18:00',
          description: getLang() === 'ko' ? '자동 배분된 시험 대비 학습 세션' : 'Auto-distributed exam preparation block',
          priority: 'high',
          reminderMinutes: 15,
          completed: false,
          sourceExamId: exam.id,
          createdAt: Date.now()
        });
      }
      return created;
    }

    function computeUnlockedBadges(sessions, roomsCount) {
      var list = sessions || [];
      var totalMins = list.reduce(function (acc, s) { return acc + (s.durationMinutes || 0); }, 0);
      var streak = computeStreakSummary(list);
      var badges = [];
      if (list.length >= 1) badges.push('first_session');
      if (totalMins >= 300) badges.push('five_hours');
      if (totalMins >= 1200) badges.push('twenty_hours');
      if (streak.longestStreak >= 7) badges.push('seven_day_streak');
      if (list.some(function (s) { return (s.durationMinutes || 0) >= 60; })) badges.push('deep_focus_60');
      if ((roomsCount || 0) > 0 || list.some(function (s) { return !!s.roomId; })) badges.push('room_collaborator');
      return badges;
    }

    function getUserWeekMinutes(sessions, weekKey) {
      var wk = weekKey || getWeekKey(new Date());
      return (sessions || []).reduce(function (acc, s) {

    function loadSandboxIntoState() {
      var data = null;
      try {
        var raw = localStorage.getItem(LS_KEYS.sandboxData);
        if (raw) data = JSON.parse(raw);
      } catch (e) {}
      if (!data || !data.profile) {
        data = createInitialSandboxState();
        saveSandboxFromState(data);
      }
      state.profile = data.profile;
      state.sessions = data.sessions || [];
      state.rooms = data.rooms || [];
      state.friendships = data.friendships || [];
      state.friendProfiles = {};
      (data.friendProfilesList || []).forEach(function (fp) { state.friendProfiles[fp.uid] = fp; });
      state.publicUsers = [state.profile].concat(data.friendProfilesList || []);
      state.challenges = data.challenges || [];
      state.notifications = data.notifications || [];
      state.friendMessages = data.friendMessages || [];
      state.calendarEvents = data.calendarEvents || [];
      state.learningGoals = data.learningGoals || [];
      state.examPlans = data.examPlans || [];
      state.authMode = 'sandbox';
    }

    function saveSandboxFromState(overrideData) {
      if (!overrideData && state.authMode !== 'sandbox') return;
      var payload = overrideData || {
        profile: state.profile,
        sessions: state.sessions,
        rooms: state.rooms,
        friendships: state.friendships,
        friendProfilesList: Object.keys(state.friendProfiles).map(function (k) { return state.friendProfiles[k]; }),
        challenges: state.challenges,
        notifications: state.notifications,
        friendMessages: state.friendMessages,
        calendarEvents: state.calendarEvents,
        learningGoals: state.learningGoals,
        examPlans: state.examPlans
      };
      try {
        localStorage.setItem(LS_KEYS.sandboxActive, '1');
        localStorage.setItem(LS_KEYS.sandboxData, JSON.stringify(payload));
      } catch (e) {}
    }

    /* Dynamic Firebase Modular CDN Loader (HTTP/HTTPS only — connects to named Firestore DB) */
    function initFirebaseIfWeb() {
      if (isFileProtocol) {
        loadSandboxIntoState();
        renderApp();
        return;
      }
      renderApp();
      var base = 'https://www.gstatic.com/firebasejs/11.4.0/';
      Promise.all([
        import(base + 'firebase-app.js'),
        import(base + 'firebase-auth.js'),
        import(base + 'firebase-firestore.js')
      ]).then(function (mods) {
        var appMod = mods[0];
        var authMod = mods[1];
        var fsMod = mods[2];
        var fbApp = appMod.initializeApp({
          projectId: FIREBASE_CONFIG.projectId,
          appId: FIREBASE_CONFIG.appId,
          apiKey: FIREBASE_CONFIG.apiKey,
          authDomain: FIREBASE_CONFIG.authDomain,
          storageBucket: FIREBASE_CONFIG.storageBucket,
          messagingSenderId: FIREBASE_CONFIG.messagingSenderId
        });
        var auth = authMod.getAuth(fbApp);
        var db = fsMod.getFirestore(fbApp, FIREBASE_CONFIG.firestoreDatabaseId);
        state.fb = { auth: auth, db: db, authMod: authMod, fsMod: fsMod };
        state.firebaseReady = true;

        // Verify Firestore connection
        fsMod.getDocFromServer(fsMod.doc(db, 'test', 'connection')).catch(function (err) {
          if (err && err.message && err.message.indexOf('offline') !== -1) {
            console.warn('Firestore connection check: client appears offline.');
          }
        });

        authMod.onAuthStateChanged(auth, function (user) {
          clearFbUnsubs();
          if (user) {
            state.firebaseUser = user;
            state.authMode = 'firebase';
            try { localStorage.removeItem(LS_KEYS.sandboxActive); } catch (e) {}
            ensureUserInitialized(user).then(function () {
              attachFirebaseListeners(user.uid);
              renderApp();
            }).catch(function (err) {
              handleFirestoreError(err, 'write', 'users/' + user.uid);
            });
          } else {
            state.firebaseUser = null;
            if (localStorage.getItem(LS_KEYS.sandboxActive) === '1') {
              loadSandboxIntoState();
            } else {
              state.authMode = 'signed_out';
            }
            renderApp();
          }
        });
      }).catch(function (err) {
        console.warn('Firebase CDN unavailable, falling back to Local Mode:', err);
        loadSandboxIntoState();
        renderApp();
      });
    }

    function clearFbUnsubs() {
      state.unsubs.forEach(function (u) { try { u(); } catch (e) {} });
      state.unsubs = [];
    }

    function handleFirestoreError(err, opType, path) {
      var u = state.firebaseUser;
      var payload = {
        error: err && err.message ? err.message : String(err),
        operationType: opType,
        path: path,
        authInfo: {
          userId: u ? u.uid : null,
          email: u ? u.email : null
        }
      };
      console.error('Firestore Error:', JSON.stringify(payload));
      showToast(getLang() === 'ko' ? '저장 중 오류가 발생했습니다.' : 'Sync error: ' + payload.error);
    }

      state.unsubs.push(fs.onSnapshot(fs.doc(db, 'users', uid), function (snap) {
        if (snap.exists()) {
          state.profile = snap.data();
          renderApp();

      }, function (e) { handleFirestoreError(e, 'get', 'users/' + uid); }));

      // Sessions
      var sesQ = fs.query(fs.collection(db, 'sessions'), fs.where('userId', '==', uid));
      state.unsubs.push(fs.onSnapshot(sesQ, function (snap) {
        var list = [];
        snap.forEach(function (d) { list.push(Object.assign({ id: d.id }, d.data())); });
        list.sort(function (a, b) { return (b.endedAt || 0) - (a.endedAt || 0); });

    /* Unified Data Mutations (works identically in Firebase & Sandbox Mode) */
    function dbWriteDoc(pathParts, data, merge) {
      if (state.authMode === 'sandbox' || !state.fb) {
        saveSandboxFromState();
        return Promise.resolve();
      }
      var fs = state.fb.fsMod;
      var ref = fs.doc.apply(null, [state.fb.db].concat(pathParts));
      return fs.setDoc(ref, data, merge ? { merge: true } : undefined)
        .catch(function (e) { handleFirestoreError(e, 'write', pathParts.join('/')); });
    }

    function dbDeleteDoc(pathParts) {
      if (state.authMode === 'sandbox' || !state.fb) {
        saveSandboxFromState();
        return Promise.resolve();
      }
      var fs = state.fb.fsMod;
      var ref = fs.doc.apply(null, [state.fb.db].concat(pathParts));
      return fs.deleteDoc(ref).catch(function (e) { handleFirestoreError(e, 'delete', pathParts.join('/')); });
    }

    function syncCompletedSessionToPlanner(session) {
      var mins = Math.max(0, Math.round(session.durationMinutes || 0));
      if (!mins) return;
      var sid = session.id;
      var sDate = session.dateKey;
      var sSub = session.subject;

      state.learningGoals = state.learningGoals.map(function (g) {
        var counted = Array.isArray(g.countedSessionIds) ? g.countedSessionIds : [];
        if (counted.indexOf(sid) !== -1) return g;
        var inRange = (!g.startDateKey || sDate >= g.startDateKey) && (!g.endDateKey || sDate <= g.endDateKey);
        var subjectMatches = !g.subject || g.subject === sSub;
        if (inRange && subjectMatches) {
          var nextProg = (g.progressMinutes || 0) + mins;
          var updated = Object.assign({}, g, {
            progressMinutes: nextProg,
            completed: nextProg >= (g.targetMinutes || 1),
            countedSessionIds: counted.concat([sid])
          });
          if (state.authMode === 'firebase' && state.profile) {
            dbWriteDoc(['users', state.profile.uid, 'learningGoals', g.id], updated, true);
          }
          return updated;
        }
        return g;
      });

      state.examPlans = state.examPlans.map(function (ex) {
        var counted = Array.isArray(ex.countedSessionIds) ? ex.countedSessionIds : [];
        if (counted.indexOf(sid) !== -1) return ex;
        if (ex.subject === sSub && sDate <= ex.examDateKey) {
          var updatedEx = Object.assign({}, ex, {
            completedMinutes: (ex.completedMinutes || 0) + mins,
            countedSessionIds: counted.concat([sid])
          });
          if (state.authMode === 'firebase' && state.profile) {
            dbWriteDoc(['users', state.profile.uid, 'examPlans', ex.id], updatedEx, true);
          }
          return updatedEx;
        }
        return ex;
      });

      if (session.linkedEventId) {
        state.calendarEvents = state.calendarEvents.map(function (ev) {
          if (ev.id === session.linkedEventId && !ev.completed) {
            var updEv = Object.assign({}, ev, { completed: true });
            if (state.authMode === 'firebase' && state.profile) {
              dbWriteDoc(['users', state.profile.uid, 'calendarEvents', ev.id], updEv, true);
            }
            return updEv;
          }
          return ev;
        });
      }
      saveSandboxFromState();
    }

    function recomputeAndSaveProfileStats() {
      if (!state.profile) return;
      var wk = getWeekKey(new Date());
      var streak = computeStreakSummary(state.sessions);
      var totalMins = state.sessions.reduce(function (a, s) { return a + (s.durationMinutes || 0); }, 0);
      var weekMins = getUserWeekMinutes(state.sessions, wk);
      var badges = computeUnlockedBadges(state.sessions, state.rooms.length);
      state.profile = Object.assign({}, state.profile, {
        totalMinutes: totalMins,
        weeklyMinutes: weekMins,
        weeklyWeekKey: wk,
        currentStreak: streak.currentStreak,
        longestStreak: Math.max(state.profile.longestStreak || 0, streak.longestStreak),
        totalSessions: state.sessions.length,
        unlockedBadges: badges,
        isStudying: false,
        currentSubject: '',
        currentMode: ''
      });
      if (state.authMode === 'firebase') {
        dbWriteDoc(['users', state.profile.uid], state.profile, true);
      } else {
        saveSandboxFromState();
      }
    }

    /* Procedural HTML5 Canvas Scene Renderer (Self-Contained Relaxing Timer Backgrounds) */
    var sceneRafId = null;
    var sceneCanvasRef = null;
    var sceneParticles = [];

    function initSceneParticles(bgId) {
      sceneParticles = [];
      var count = bgId === 'rainy_library' ? 65 : bgId === 'ocean_horizon' ? 28 : 40;
      for (var i = 0; i < count; i++) {
        sceneParticles.push({
          x: Math.random(),
          y: Math.random(),
          speed: 0.25 + Math.random() * 0.75,
          len: 6 + Math.random() * 14,
          size: 1 + Math.random() * 2.2,
          alpha: 0.12 + Math.random() * 0.35
        });
      }
    }

    function startTimerCanvasLoop() {
      var canvas = document.getElementById('timer-bg-canvas');
      if (!canvas) {
        if (sceneRafId) { cancelAnimationFrame(sceneRafId); sceneRafId = null; }
        sceneCanvasRef = null;
        return;
      }
      if (sceneCanvasRef === canvas && sceneRafId) return;
      sceneCanvasRef = canvas;
      initSceneParticles(state.timerBgId);
      var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var startTs = performance.now();

      function drawFrame(now) {
        if (!document.body.contains(canvas)) {
          sceneRafId = null;
          sceneCanvasRef = null;
          return;
        }
        var rect = canvas.getBoundingClientRect();
        var w = Math.max(320, Math.floor(rect.width));
        var h = Math.max(240, Math.floor(rect.height));
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        var ctx = canvas.getContext('2d');
        var tSec = reducedMotion ? 0 : (now - startTs) / 1000;
        var bg = state.timerBgId;

        if (bg === 'minimal_charcoal') {
          var g0 = ctx.createLinearGradient(0, 0, w, h);
          g0.addColorStop(0, '#10141B');
          g0.addColorStop(1, '#171C26');
          ctx.fillStyle = g0;
          ctx.fillRect(0, 0, w, h);
          ctx.strokeStyle = 'rgba(59,130,246,0.06)';
          ctx.lineWidth = 1;
          for (var gx = 0; gx < w; gx += 48) {
            ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
          }
          for (var gy = 0; gy < h; gy += 48) {
            ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
          }
        } else if (bg === 'rainy_library') {
          var g1 = ctx.createLinearGradient(0, 0, 0, h);
          g1.addColorStop(0, '#141B26');
          g1.addColorStop(0.65, '#1D2533');
          g1.addColorStop(1, '#261F1B');
          ctx.fillStyle = g1;
          ctx.fillRect(0, 0, w, h);
          // Warm desk lamp glow
          var lamp = ctx.createRadialGradient(w * 0.22, h * 0.72, 12, w * 0.22, h * 0.72, w * 0.45);
          lamp.addColorStop(0, 'rgba(245, 158, 11, 0.24)');
          lamp.addColorStop(1, 'rgba(245, 158, 11, 0)');
          ctx.fillStyle = lamp;
          ctx.fillRect(0, 0, w, h);
          // Falling rain streaks
          ctx.strokeStyle = 'rgba(147, 197, 253, 0.25)';
          ctx.lineWidth = 1.2;
          sceneParticles.forEach(function (p) {
            var py = ((p.y + tSec * p.speed * 0.45) % 1) * h;
            var px = ((p.x + tSec * 0.04) % 1) * w;
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(px - 3, py + p.len);
            ctx.stroke();
          });
        } else if (bg === 'misty_forest') {
          var g2 = ctx.createLinearGradient(0, 0, 0, h);
          g2.addColorStop(0, '#18242B');
          g2.addColorStop(0.55, '#253940');
          g2.addColorStop(1, '#121E22');
          ctx.fillStyle = g2;
          ctx.fillRect(0, 0, w, h);
          // Layered pine silhouettes
          for (var layer = 0; layer < 3; layer++) {
            ctx.fillStyle = layer === 0 ? 'rgba(18,32,36,0.55)' : layer === 1 ? 'rgba(14,25,28,0.75)' : '#0C1618';
            var baseY = h * (0.64 + layer * 0.12);
            ctx.beginPath();
            ctx.moveTo(0, h);
            for (var px = 0; px <= w + 40; px += 36) {
              var peak = baseY - 30 - Math.sin(px * 0.04 + layer * 2) * 26;
              ctx.lineTo(px, peak);
              ctx.lineTo(px + 18, baseY - 6);
            }
            ctx.lineTo(w, h);
            ctx.closePath();
            ctx.fill();
          }
          // Drifting mist
          var mistOffset = Math.sin(tSec * 0.25) * 30;
          var mist = ctx.createLinearGradient(0, h * 0.5, 0, h * 0.9);
          mist.addColorStop(0, 'rgba(209,250,229,0)');
          mist.addColorStop(0.5, 'rgba(209,250,229,0.08)');
          mist.addColorStop(1, 'rgba(209,250,229,0)');
          ctx.fillStyle = mist;
          ctx.fillRect(mistOffset - 30, h * 0.5, w + 60, h * 0.4);
        } else if (bg === 'ocean_horizon') {
          var g3 = ctx.createLinearGradient(0, 0, 0, h);
          g3.addColorStop(0, '#161D36');
          g3.addColorStop(0.52, '#2B2F58');
          g3.addColorStop(0.58, '#4E395E');
          g3.addColorStop(1, '#101827');
          ctx.fillStyle = g3;
          ctx.fillRect(0, 0, w, h);
          var sun = ctx.createRadialGradient(w * 0.5, h * 0.54, 8, w * 0.5, h * 0.54, w * 0.28);
          sun.addColorStop(0, 'rgba(251, 146, 60, 0.36)');
          sun.addColorStop(1, 'rgba(251, 146, 60, 0)');
          ctx.fillStyle = sun;
          ctx.fillRect(0, 0, w, h);
          // Calm wave lines
          ctx.strokeStyle = 'rgba(147, 197, 253, 0.16)';
          ctx.lineWidth = 1.4;
          for (var row = 0; row < 6; row++) {
            var wy = h * 0.6 + row * (h * 0.065);
            ctx.beginPath();
            for (var wx = 0; wx <= w; wx += 18) {
              var waveY = wy + Math.sin(wx * 0.02 + tSec * 0.8 + row) * 3;
              if (wx === 0) ctx.moveTo(wx, waveY); else ctx.lineTo(wx, waveY);
            }
            ctx.stroke();
          }
        } else if (bg === 'zen_courtyard') {
          var g4 = ctx.createLinearGradient(0, 0, 0, h);
          g4.addColorStop(0, '#1B1715');
          g4.addColorStop(1, '#28211B');
          ctx.fillStyle = g4;
          ctx.fillRect(0, 0, w, h);
          var lantern = ctx.createRadialGradient(w * 0.78, h * 0.4, 8, w * 0.78, h * 0.4, w * 0.4);
          lantern.addColorStop(0, 'rgba(251, 191, 36, 0.2)');
          lantern.addColorStop(1, 'rgba(251, 191, 36, 0)');
          ctx.fillStyle = lantern;
          ctx.fillRect(0, 0, w, h);
          sceneParticles.forEach(function (p, idx) {
            var fx = ((p.x + Math.sin(tSec * 0.4 + idx) * 0.03 + 1) % 1) * w;
            var fy = ((p.y + Math.cos(tSec * 0.3 + idx) * 0.03 + 1) % 1) * h;
            ctx.fillStyle = 'rgba(252, 211, 77, ' + (p.alpha * 0.7) + ')';
            ctx.beginPath();
            ctx.arc(fx, fy, p.size, 0, Math.PI * 2);
            ctx.fill();
          });
        } else {
          // aurora_mist
          var g5 = ctx.createLinearGradient(0, 0, 0, h);
          g5.addColorStop(0, '#0C1426');
          g5.addColorStop(1, '#121E33');
          ctx.fillStyle = g5;
          ctx.fillRect(0, 0, w, h);
          var shift = Math.sin(tSec * 0.35) * w * 0.08;
          var aur = ctx.createRadialGradient(w * 0.45 + shift, h * 0.3, 20, w * 0.5, h * 0.35, w * 0.55);
          aur.addColorStop(0, 'rgba(45, 212, 191, 0.22)');
          aur.addColorStop(0.5, 'rgba(59, 130, 246, 0.14)');
          aur.addColorStop(1, 'rgba(15, 23, 42, 0)');
          ctx.fillStyle = aur;
          ctx.fillRect(0, 0, w, h);
          sceneParticles.forEach(function (p) {
            ctx.fillStyle = 'rgba(226, 232, 240, ' + (p.alpha * 0.85) + ')';
            ctx.beginPath();
            ctx.arc(p.x * w, p.y * h * 0.7, p.size * 0.7, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        if (!reducedMotion) {
          sceneRafId = requestAnimationFrame(drawFrame);
        }
      }

      if (reducedMotion) {
        drawFrame(startTs);
      } else {
        sceneRafId = requestAnimationFrame(drawFrame);
      }
    }

    function getFriendIds() {
      var me = state.profile ? state.profile.uid : '';
      var ids = [];
      state.friendships.forEach(function (fr) {
        if (fr.status === 'accepted' && Array.isArray(fr.userIds)) {
          var other = fr.userIds[0] === me ? fr.userIds[1] : fr.userIds[0];
          if (other && ids.indexOf(other) === -1) ids.push(other);
        }
      });
      return ids;
    }

    function getDisplayPerson(uid) {
      if (state.profile && uid === state.profile.uid) return state.profile;
      if (state.friendProfiles[uid]) return state.friendProfiles[uid];
      var found = (state.publicUsers || []).find(function (u) { return u.uid === uid; });
      return found || { uid: uid, displayName: 'Student', username: 'student', avatarUrl: AVATAR_PRESETS[3].url };

    function getRemainingTimerSeconds() {
      var at = state.activeTimer;
      if (!at) return 0;
      if (at.paused) return Math.max(0, Math.round(at.remainingSeconds || 0));
      var elapsed = Math.floor((Date.now() - at.startedAt) / 1000);
      return Math.max(0, (at.targetSeconds || 0) - (at.pausedElapsedSeconds || 0) - elapsed);
    }

    function getElapsedTimerMinutes() {
      var at = state.activeTimer;
      if (!at) return 0;
      var rem = getRemainingTimerSeconds();
      var doneSec = Math.max(0, (at.targetSeconds || 0) - rem);
      return Math.max(1, Math.round(doneSec / 60));
    }

                + (r.goal ? '<div class="text-sm text-muted">' + esc(r.goal) + '</div>' : '')

        var filtered = state.sessions.filter(function (s) {

                  + '</form>';
              }
              return '<div class="card-muted row-between" style="padding:12px">'
                + '<div class="stack" style="gap:4px"><div class="row"><span class="dot" style="background:' + getSubjectHex(s.subject) + '"></span><strong>' + esc(translateSubject(s.subject)) + '</strong><span class="badge">' + s.durationMinutes + 'm</span><span class="text-xs text-muted">' + esc(formatReadableDate(s.dateKey)) + '</span></div>'
                + (s.learningGoal ? '<div class="text-xs text-muted">' + esc(s.learningGoal) + '</div>' : '')
                + (s.whatLearned ? '<div class="text-sm">' + esc(s.whatLearned) + '</div>' : '')
                + '</div>'
                + '<div class="row">'
                + '<button class="btn btn-ghost btn-sm" data-action="start-edit-session" data-id="' + esc(s.id) + '">' + esc(t('edit_btn')) + '</button>'
                + '<button class="btn btn-ghost btn-sm" data-action="delete-session" data-id="' + esc(s.id) + '">' + icon('trash', 14) + '</button>'
                + '</div></div>';
            }).join('') + '</div>')
          + '</div>';
      } else {
        // Analytics
        var bySub = {};
        state.sessions.forEach(function (s) { bySub[s.subject] = (bySub[s.subject] || 0) + (s.durationMinutes || 0); });
        var subEntries = Object.keys(bySub).map(function (k) { return { subject: k, mins: bySub[k] }; }).sort(function (a, b) { return b.mins - a.mins; });
        var maxSub = Math.max(60, subEntries[0] ? subEntries[0].mins : 60);
        var thisWk = getUserWeekMinutes(state.sessions, getWeekKey(new Date()));
        var lastWk = getUserWeekMinutes(state.sessions, getPrevWeekKey(new Date()));
        var days30 = getWeekDateKeys(30);
        var dayMap = {};
        state.sessions.forEach(function (s) { dayMap[s.dateKey] = (dayMap[s.dateKey] || 0) + (s.durationMinutes || 0); });
        var maxDay = Math.max(60, Math.max.apply(null, days30.map(function (dk) { return dayMap[dk] || 0; })));

        html += '<div class="grid-2">'
          + '<div class="card stack"><h2 class="h2">' + esc(t('subject_breakdown')) + '</h2>'
          + (subEntries.length === 0 ? '<div class="text-sm text-muted">—</div>' : subEntries.map(function (e) {
              var pct = Math.round((e.mins / maxSub) * 100);
              return '<div><div class="row-between text-xs" style="margin-bottom:4px"><span>' + esc(translateSubject(e.subject)) + '</span><span class="mono">' + esc(formatMinutes(e.mins)) + '</span></div>'
                + '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;background:' + getSubjectHex(e.subject) + '"></div></div></div>';
            }).join(''))
          + '</div>'

          + '<div class="card stack"><h2 class="h2">' + esc(t('weekly_comparison')) + '</h2>'
          + '<div class="grid-2"><div class="card-muted"><div class="kpi-label">' + esc(t('week_focus')) + '</div><div class="kpi-value">' + esc(formatMinutes(thisWk)) + '</div></div>'
          + '<div class="card-muted"><div class="kpi-label">Prev Week</div><div class="kpi-value">' + esc(formatMinutes(lastWk)) + '</div></div></div>'
          + '<h3 class="h3" style="margin-top:8px">' + esc(t('daily_trend_30')) + '</h3>'
          + '<svg viewBox="0 0 300 90" style="width:100%;height:110px;display:block">'
          + days30.map(function (dk, idx) {
              var val = dayMap[dk] || 0;
              var bh = Math.max(2, Math.round((val / maxDay) * 76));
              return '<rect x="' + (idx * 10 + 1) + '" y="' + (82 - bh) + '" width="7" height="' + bh + '" rx="2" fill="' + (val > 0 ? '#3B82F6' : 'rgba(148,163,184,0.22)') + '"><title>' + esc(dk + ': ' + val + 'm') + '</title></rect>';
            }).join('')
          + '</svg></div></div>';
      }
      html += '</div>';
      return html;
    }

        return !u.hideFromLeaderboard || u.uid === me;
      });
      var sorted = candidates.slice().sort(function (a, b) {
        if (state.lbTab === 'streak') return (b.longestStreak || 0) - (a.longestStreak || 0);
        if (state.lbTab === 'sessions') return (b.totalSessions || 0) - (a.totalSessions || 0);

      return '<div class="stack" style="gap:18px">'
        + '<div class="row-between" style="flex-wrap:wrap">'

              + '<td class="num mono">' + (u.totalSessions || 0) + '</td>'
              + '</tr>';
          }).join('') + '</tbody></table></div></div>';

          endTime: '',

          + '<div class="row-between"><h2 class="h2">' + esc(ev.id ? t('edit_btn') : t('add_event_btn')) + '</h2><button type="button" class="btn btn-ghost btn-sm" data-action="close-modal">✕</button></div>'

          + '<div><label class="field-label">' + esc(t('event_start_label')) + '</label><input class="input" type="time" name="startTime" value="' + esc(ev.startTime || '') + '"></div>'
          + '<div><label class="field-label">' + esc(t('event_end_label')) + '</label><input class="input" type="time" name="endTime" value="' + esc(ev.endTime || '') + '"></div>'
          + '</div>'
          + '<div class="grid-2">'
          + '<div><label class="field-label">' + esc(t('event_priority_label')) + '</label><select class="select" name="priority"><option value="low" ' + (ev.priority === 'low' ? 'selected' : '') + '>' + esc(t('prio_low')) + '</option><option value="medium" ' + (ev.priority === 'medium' ? 'selected' : '') + '>' + esc(t('prio_medium')) + '</option><option value="high" ' + (ev.priority === 'high' ? 'selected' : '') + '>' + esc(t('prio_high')) + '</option></select></div>'
          + '<div><label class="field-label">' + esc(t('event_reminder_label')) + ' (min)</label><input class="input" type="number" name="reminderMinutes" min="0" max="1440" value="' + (ev.reminderMinutes || 15) + '"></div>'
          + '</div>'
          + '<div><label class="field-label">' + esc(t('event_desc_label')) + '</label><textarea class="textarea" name="description" maxlength="400">' + esc(ev.description || '') + '</textarea></div>'
          + '<div class="row-between"><button type="button" class="btn btn-ghost" data-action="close-modal">' + esc(t('cancel_btn')) + '</button><button type="submit" class="btn btn-primary">' + esc(t('save_btn')) + '</button></div>'
          + '</form></div>';
      }

      if (m.type === 'push') {
        var fp = getDisplayPerson(m.uid);
        var templates = getStudyPushTemplates();
        return '<div class="modal-backdrop" data-action="close-modal-bg">'
          + '<form class="modal-card" data-form="send-push">'
          + '<input type="hidden" name="toUid" value="' + esc(m.uid) + '">'
          + '<div class="row-between"><h2 class="h2">' + esc(tf('push_modal_title', { name: fp.displayName })) + '</h2><button type="button" class="btn btn-ghost btn-sm" data-action="close-modal">✕</button></div>'
          + '<div class="text-xs text-muted">' + esc(t('push_templates_label')) + '</div>'
          + '<div class="stack" style="gap:6px">' + templates.map(function (tpl) {
              return '<button type="button" class="btn btn-secondary btn-sm" style="justify-content:flex-start;text-align:left;height:auto;padding:8px 10px;white-space:normal" data-action="fill-push-tpl" data-text="' + esc(tpl) + '">' + esc(tpl) + '</button>';
            }).join('') + '</div>'
          + '<textarea class="textarea" id="push-msg-input" name="message" required maxlength="500" placeholder="' + esc(t('push_custom_ph')) + '"></textarea>'
          + '<div class="row-between"><button type="button" class="btn btn-ghost" data-action="close-modal">' + esc(t('cancel_btn')) + '</button><button type="submit" class="btn btn-primary">' + icon('send', 14) + ' ' + esc(t('send_push_btn')) + '</button></div>'
          + '</form></div>';
      }

      if (m.type === 'chat') {
        var peer = getDisplayPerson(m.uid);
        var me = state.profile ? state.profile.uid : '';
        var pairKey = [me, m.uid].sort().join('__');
        var msgs = (state.friendMessages || []).filter(function (msg) { return msg.pairKey === pairKey; });
        return '<div class="modal-backdrop" data-action="close-modal-bg">'
          + '<div class="modal-card">'
          + '<div class="row-between"><div class="row"><img src="' + esc(peer.avatarUrl || AVATAR_PRESETS[0].url) + '" width="30" height="30" style="border-radius:50%" alt=""><h2 class="h2">' + esc(tf('chat_with', { name: peer.displayName })) + '</h2></div><button type="button" class="btn btn-ghost btn-sm" data-action="close-modal">✕</button></div>'
          + '<div class="stack" style="max-height:300px;overflow-y:auto;padding:6px 0;gap:8px">'
          + (msgs.length === 0 ? '<div class="text-sm text-muted" style="text-align:center;padding:24px 0">—</div>' : msgs.map(function (msg) {
              var mine = msg.fromUserId === me;
              return '<div style="align-self:' + (mine ? 'flex-end' : 'flex-start') + ';max-width:82%;background:' + (mine ? 'var(--accent)' : 'var(--surface-2)') + ';color:' + (mine ? '#fff' : 'var(--text)') + ';padding:8px 12px;border-radius:10px">'
                + '<div class="text-sm">' + esc(msg.text) + '</div>'
                + '<div class="text-xs" style="opacity:0.72;margin-top:2px;text-align:right">' + esc(formatMessageTimeLocalized(msg.createdAt)) + '</div>'
                + '</div>';
            }).join(''))
          + '</div>'
          + '<form class="row" data-form="send-chat">'
          + '<input type="hidden" name="toUid" value="' + esc(m.uid) + '">'
          + '<input class="input" name="text" required maxlength="500" placeholder="' + esc(t('chat_input_ph')) + '" autocomplete="off">'
          + '<button class="btn btn-primary" type="submit">' + esc(t('send_btn')) + '</button>'
          + '</form></div></div>';
      }

      if (m.type === 'friend_profile') {
        var fp2 = getDisplayPerson(m.uid);
        return '<div class="modal-backdrop" data-action="close-modal-bg">'
          + '<div class="modal-card">'
          + '<div class="row-between"><div class="row"><img src="' + esc(fp2.avatarUrl || AVATAR_PRESETS[0].url) + '" width="44" height="44" style="border-radius:50%" alt=""><div><h2 class="h2">' + esc(fp2.displayName) + '</h2><div class="text-xs text-muted mono">@' + esc(fp2.username) + ' · ' + esc(fp2.friendCode || '') + '</div></div></div><button type="button" class="btn btn-ghost btn-sm" data-action="close-modal">✕</button></div>'
          + (fp2.bio ? '<p class="text-sm text-muted">' + esc(fp2.bio) + '</p>' : '')
          + '<div class="grid-3">'
          + '<div class="card-muted"><div class="kpi-label">' + esc(t('week_focus')) + '</div><div class="h3 mono">' + esc(formatMinutes(fp2.weeklyMinutes || 0)) + '</div></div>'
          + '<div class="card-muted"><div class="kpi-label">' + esc(t('current_streak')) + '</div><div class="h3 mono">' + (fp2.currentStreak || 0) + 'd</div></div>'
          + '<div class="card-muted"><div class="kpi-label">' + esc(t('lb_sessions_col')) + '</div><div class="h3 mono">' + (fp2.totalSessions || 0) + '</div></div>'
          + '</div></div></div>';
      }
      return '';
    }

    function renderApp() {
      applyThemeAndLang();
      var appEl = document.getElementById('app');
      var modalEl = document.getElementById('modal-root');
      if (!appEl) return;

      if (state.authMode === 'checking') {
        appEl.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted)">Loading StudyTogether...</div>';
      } else if (state.authMode === 'signed_out') {
        appEl.innerHTML = renderAuthGate();
      } else {
        appEl.innerHTML = renderShell();
      }

      if (modalEl) modalEl.innerHTML = renderModals();
      startTimerCanvasLoop();
    }

    function completeActiveTimerNow() {
      var at = state.activeTimer;
      if (!at) return;
      var mins = getElapsedTimerMinutes();
      state.pendingJournal = {
        subject: at.subject,
        mode: at.mode,
        durationMinutes: mins,
        startedAt: at.startedAt,
        endedAt: Date.now(),
        learningGoal: at.learningGoal || '',
        visibility: at.visibility || 'friends',
        linkedEventId: at.linkedEventId || ''
      };
      persistActiveTimer(null);
      if (state.profile) {
        state.profile.isStudying = false;
        state.profile.currentSubject = '';
        state.profile.currentMode = '';
        if (state.authMode === 'firebase') dbWriteDoc(['users', state.profile.uid], state.profile, true);
        else saveSandboxFromState();
      }
      renderApp();
    }

    /* Delegated Interactions */
    document.addEventListener('click', function (e) {
      var target = e.target.closest('[data-action]');
      if (!target) return;
      var act = target.getAttribute('data-action');

      if (act === 'toggle-lang') {
        state.settings.language = getLang() === 'ko' ? 'en' : 'ko';
        renderApp();
      } else if (act === 'toggle-theme') {
        state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
        renderApp();
      } else if (act === 'toggle-sidebar') {
        state.sidebarOpen = !state.sidebarOpen;
        renderApp();
      } else if (act === 'go-nav') {
        state.nav = target.getAttribute('data-nav');
        state.sidebarOpen = false;
        state.notifOpen = false;
        renderApp();
      } else if (act === 'enter-sandbox') {
        loadSandboxIntoState();
        renderApp();
      } else if (act === 'google-signin') {
        if (!state.fb) { showToast('Deploy on HTTPS to use Google Sign-In'); return; }
        var provider = new state.fb.authMod.GoogleAuthProvider();
        state.fb.authMod.signInWithPopup(state.fb.auth, provider).catch(function (err) {
          showToast(err && err.message ? err.message : 'Sign-in cancelled');
        });
      } else if (act === 'sign-out') {
        persistActiveTimer(null);
        if (state.authMode === 'firebase' && state.fb) {
          state.fb.authMod.signOut(state.fb.auth);
        } else {
          try {
            localStorage.removeItem(LS_KEYS.sandboxActive);
            localStorage.removeItem(LS_KEYS.sandboxData);
          } catch (err) {}
          state.authMode = isFileProtocol ? 'sandbox' : 'signed_out';
          if (isFileProtocol) loadSandboxIntoState();
          renderApp();
        }
      } else if (act === 'toggle-notifs') {
        state.notifOpen = !state.notifOpen;
        renderApp();
      } else if (act === 'mark-all-notifs') {
        state.notifications = state.notifications.map(function (n) {
          if (!n.read && state.authMode === 'firebase' && state.profile) {
            dbWriteDoc(['users', state.profile.uid, 'notifications', n.id], { read: true }, true);
          }
          return Object.assign({}, n, { read: true });
        });
        saveSandboxFromState();
        renderApp();
      } else if (act === 'set-study-tab') {
        state.studySubView = target.getAttribute('data-tab');
        renderApp();
      } else if (act === 'set-timer-dur') {
        state.timerSetup.durationMinutes = Number(target.getAttribute('data-mins')) || 45;
        renderApp();
      } else if (act === 'cycle-timer-bg') {
        var idx = TIMER_BACKGROUNDS.findIndex(function (b) { return b.id === state.timerBgId; });
        state.timerBgId = TIMER_BACKGROUNDS[(idx + 1) % TIMER_BACKGROUNDS.length].id;
        try { localStorage.setItem(LS_KEYS.timerBg, state.timerBgId); } catch (err) {}
        initSceneParticles(state.timerBgId);
        renderApp();
      } else if (act === 'set-timer-bg') {
        state.timerBgId = target.getAttribute('data-bg');
        try { localStorage.setItem(LS_KEYS.timerBg, state.timerBgId); } catch (err) {}
        initSceneParticles(state.timerBgId);
        renderApp();
      } else if (act === 'cycle-timer-dim') {
        var levels = ['soft', 'balanced', 'deep'];
        state.timerDimLevel = levels[(levels.indexOf(state.timerDimLevel) + 1) % levels.length];
        try { localStorage.setItem(LS_KEYS.timerDim, state.timerDimLevel); } catch (err) {}
        renderApp();
      } else if (act === 'start-timer') {
        var subEl = document.getElementById('ts-subject');
        var modEl = document.getElementById('ts-mode');
        var visEl = document.getElementById('ts-vis');
        var durEl = document.getElementById('ts-custom-dur');
        var golEl = document.getElementById('ts-goal');
        var mins = Math.max(5, Math.min(240, Number(durEl ? durEl.value : state.timerSetup.durationMinutes) || 45));
        state.timerSetup.subject = subEl ? subEl.value : state.timerSetup.subject;
        state.timerSetup.mode = modEl ? modEl.value : state.timerSetup.mode;
        state.timerSetup.visibility = visEl ? visEl.value : state.timerSetup.visibility;
        state.timerSetup.learningGoal = golEl ? golEl.value : state.timerSetup.learningGoal;
        state.timerSetup.durationMinutes = mins;
        persistActiveTimer({
          id: makeId('tmr'),
          subject: state.timerSetup.subject,
          mode: state.timerSetup.mode,
          visibility: state.timerSetup.visibility,
          learningGoal: clampStr(state.timerSetup.learningGoal, BLUEPRINT_LIMITS.learningGoalMax),
          targetSeconds: mins * 60,
          startedAt: Date.now(),
          paused: false,
          pausedElapsedSeconds: 0,
          checkedIn: false
        });
        if (state.profile) {
          state.profile.isStudying = true;
          state.profile.currentSubject = state.timerSetup.subject;
          state.profile.currentMode = state.timerSetup.mode;
          if (state.authMode === 'firebase') dbWriteDoc(['users', state.profile.uid], state.profile, true);
          else saveSandboxFromState();
        }
        renderApp();
      } else if (act === 'pause-timer') {
        if (state.activeTimer && !state.activeTimer.paused) {
          var rem = getRemainingTimerSeconds();
          state.activeTimer.paused = true;
          state.activeTimer.remainingSeconds = rem;
          state.activeTimer.pausedElapsedSeconds = (state.activeTimer.targetSeconds || 0) - rem;
          persistActiveTimer(state.activeTimer);
          renderApp();
        }
      } else if (act === 'resume-timer') {
        if (state.activeTimer && state.activeTimer.paused) {
          state.activeTimer.paused = false;
          state.activeTimer.startedAt = Date.now();
          persistActiveTimer(state.activeTimer);
          renderApp();
        }
      } else if (act === 'complete-timer') {
        completeActiveTimerNow();
      } else if (act === 'cancel-timer') {
        persistActiveTimer(null);
        if (state.profile) {
          state.profile.isStudying = false;
          state.profile.currentSubject = '';
          if (state.authMode === 'firebase') dbWriteDoc(['users', state.profile.uid], state.profile, true);
          else saveSandboxFromState();
        }
        renderApp();
      } else if (act === 'confirm-checkin') {
        if (state.activeTimer) {
          state.activeTimer.checkedIn = true;
          persistActiveTimer(state.activeTimer);
          renderApp();
        }
      } else if (act === 'discard-journal') {
        state.pendingJournal = null;
        renderApp();
      } else if (act === 'start-break') {
        state.breakTimer = { running: true, remainingSec: 300 };
        renderApp();
      } else if (act === 'stop-break') {
        state.breakTimer = { running: false, remainingSec: 300 };
        renderApp();
      } else if (act === 'join-room' || act === 'leave-room') {
        var rid = target.getAttribute('data-id');
        var me = state.profile ? state.profile.uid : '';
        state.rooms = state.rooms.map(function (r) {
          if (r.id !== rid) return r;

      }

        state.breakTimer.remainingSec = Math.max(0, state.breakTimer.remainingSec - 1);
